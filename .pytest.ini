[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts =
	-v
	--cov=src
	--cov-report=term-missing
	--cov-report=html
	--cov-report=xml
	--strict-markers
	-ra

markers =
	slow: marks tests as slow (deselect with '-m "not slow"')
	integration: marks tests as integration tests
	unit: marks tests as unit tests
