name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linters
        run: |
          flake8 src tests --max-line-length=100
          black --check src tests --line-length=100 2>/dev/null || true

      - name: Run mypy type checking
        run: |
          mypy src --ignore-missing-imports --no-error-summary 2>/dev/null || true

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          env_vars: OS,PYTHON
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: | 
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run safety scan 
        run: |
          pip install safety
          safety scan --continue-on-error -- output json > safety-report.json
        continue-on-error: true

      - name: Run bandit security scanner
        run: |
          pip install bandit
          bandit -r src -f summary || true

  integration:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run integration tests
        run: |
          pytest -m integration -v --tb=short
        env:
          TEST_OSM_API_KEY: ${{ secrets.TEST_OSM_API_KEY }}
